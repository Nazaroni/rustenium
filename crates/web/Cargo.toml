[package]
name = "rustenium-web"
version = "0.1.0"
edition = "2024"
authors = ["Nazar Malyy <nazar@malyy.net>"]
license = "MIT OR Apache-2.0"

[dependencies]
rustenium-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[[example]]
name = "web_basic"
path = "../../examples/web_basic.rs"

[[example]]
name = "web_google"
path = "../../examples/web_google.rs"

[[example]]
name = "web_element_attributes"
path = "../../examples/web_element_attributes.rs"

[[example]]
name = "web_waits"
path = "../../examples/web_waits.rs"
