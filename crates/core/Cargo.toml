[package]
name = "rustenium-core"
version = "0.1.0"
edition = "2024"
authors = ["Nazar Malyy <nazar@malyy.net>"]
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
